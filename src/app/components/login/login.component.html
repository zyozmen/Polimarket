<div class="login-container">
  <div class="row justify-content-center">
    <div>
      <div class="card shadow-lg">
        <div class="card-body">
          <div class="text-center mb-4">
            <h2 class="card-title">PoliMarket</h2>
            <p class="text-muted">Iniciar Sesión</p>
          </div>

          <!-- Mensaje de error -->
          <div *ngIf="error" class="alert alert-danger alert-dismissible fade show" role="alert">
            {{ error }}
            <button type="button" class="btn-close" (click)="error = ''" aria-label="Close"></button>
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label for="usuario" class="form-label">Usuario</label>
              <input 
                type="text" 
                class="form-control" 
                id="usuario" 
                formControlName="usuario"
                [class.is-invalid]="f['usuario'].invalid && f['usuario'].touched"
                placeholder="Ingrese su usuario">
              <div *ngIf="f['usuario'].invalid && f['usuario'].touched" class="invalid-feedback">
                <div *ngIf="f['usuario'].errors?.['required']">El usuario es requerido</div>
                <div *ngIf="f['usuario'].errors?.['minlength']">El usuario debe tener al menos 3 caracteres</div>
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input 
                type="password" 
                class="form-control" 
                id="password" 
                formControlName="password"
                [class.is-invalid]="f['password'].invalid && f['password'].touched"
                placeholder="Ingrese su contraseña">
              <div *ngIf="f['password'].invalid && f['password'].touched" class="invalid-feedback">
                <div *ngIf="f['password'].errors?.['required']">La contraseña es requerida</div>
                <div *ngIf="f['password'].errors?.['minlength']">La contraseña debe tener al menos 4 caracteres</div>
              </div>
            </div>

            <button 
              type="submit" 
              class="btn btn-primary w-100"
              [disabled]="loading || loginForm.invalid">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
              {{ loading ? 'Iniciando sesión...' : 'Ingresar' }}
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
